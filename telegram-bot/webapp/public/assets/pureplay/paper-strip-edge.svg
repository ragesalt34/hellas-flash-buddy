<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" preserveAspectRatio="none">
  <!-- Torn-paper mask for strips (answer band, topic tag): long, low waves on
       the top and bottom edges, a finer tremor on the sides. Used as a CSS mask
       stretched to any size, so it must keep preserveAspectRatio="none". -->
  <filter id="tear" x="-2%" y="-12%" width="104%" height="124%">
    <feTurbulence type="fractalNoise" baseFrequency="0.03 0.5" numOctaves="3" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="10" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <rect x="8" y="10" width="1184" height="140" rx="3" fill="white" filter="url(#tear)"/>
</svg>
