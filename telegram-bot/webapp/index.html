    <!-- Rubik = display (lat/cyr), Onest = body (lat/cyr), Manrope = Greek
         fallback for both (Rubik & Onest ship no Greek glyphs). Greek subset of
         Manrope loads on demand; its lat/cyr subsets never download.
         Inter is the single family of the `brut` theme and covers lat/cyr/greek
         on its own; declaring it here costs nothing while that theme is off,
         because the browser only downloads a face once something uses it. -->
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@600&family=Pangolin&family=Balsamiq+Sans:wght@700&family=Rubik:wght@500;600;700;800&family=Onest:wght@500;600;700;800&family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Kill any stale service worker + caches left by an earlier version of the
         site (the old Lovable app registered one). A dead SW keeps serving an
         outdated app shell that references CSS/JS hashes which no longer exist,
         producing an unstyled page that survives hard-refresh. This app ships no
         SW, so unregistering is always safe; reload once after cleanup. -->
    <script>
      (function () {
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          if (!regs.length) return;
          Promise.all(regs.map(function (r) { return r.unregister(); })).then(function () {
            if (window.caches && caches.keys) {
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              }).finally(function () { location.reload(); });
            } else {
              location.reload();
            }
          });
        }).catch(function () {});
      })();
    </script>

    <!-- Self-heal a poisoned asset cache. During a Cloudflare Pages deploy a
         request for a not-yet-published /assets/* file could be answered with
         index.html (HTTP 200, text/html). /assets/* is served immutable for a
         year, so the browser kept that HTML under the asset's URL and the site
         stayed blank — no CSS, no JS — even after the deploy finished. When an
         asset fails to load, re-fetch every asset of this page with
         cache: 'reload' (which overwrites the browser's cached copy) and reload
         once. Registered before the bundle's own tags so it sees their errors. -->
    <script>
      (function () {
        var KEY = 'hs_asset_heal';
        window.addEventListener('error', function (e) {
          var el = e.target;
          if (!el || (el.tagName !== 'SCRIPT' && el.tagName !== 'LINK')) return;
          var url = el.src || el.href || '';
          if (url.indexOf('/assets/') === -1) return;
          try { if (sessionStorage.getItem(KEY)) return; sessionStorage.setItem(KEY, '1'); } catch (_) { return; }
          var urls = [];
          document.querySelectorAll('script[src*="/assets/"],link[href*="/assets/"]').forEach(function (n) {
            urls.push(n.src || n.href);
          });
          Promise.all(urls.map(function (u) {
            return fetch(u, { cache: 'reload' }).catch(function () {});
          })).then(function () { location.reload(); });
        }, true);
        // Clear the one-shot guard once the page has loaded fine, so a later
        // deploy in the same tab can heal again.
        window.addEventListener('load', function () {
          setTimeout(function () {
            try { if (document.getElementById('root').children.length) sessionStorage.removeItem(KEY); } catch (_) {}
          }, 3000);
        });
      })();
    </script>

    <!-- Wake the API (Render free tier sleeps after idle) as early as possible —
